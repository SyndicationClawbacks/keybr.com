name: Build desktop apps (manual)

# No automatic triggers or test jobs.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: "0"
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-universal-12-plus
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: desktop/releases/Keybr-Desktop-macOS-universal.tar.gz
          - name: Linux-x86_64
            # Use an older Ubuntu baseline for compatibility with newer systems.
            os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
            artifact: desktop/releases/Keybr-Desktop-Linux-x64.tar.gz
          - name: Windows-x86_64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            artifact: desktop/releases/Keybr-Desktop-Windows-x64/
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file pkg-config libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf libatomic1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install upstream locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install desktop tooling
        run: npm ci --prefix desktop --no-audit --no-fund
      - name: Build app and local installation script
        run: npm --prefix desktop run build:app
      - uses: actions/upload-artifact@v4
        with:
          name: Keybr-Desktop-${{ matrix.name }}
          if-no-files-found: error
          path: ${{ matrix.artifact }}
          retention-days: 30
