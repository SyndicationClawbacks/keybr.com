name: Build desktop installers (manual)

# No automatic triggers or test jobs.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: "0"
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-universal-12-plus
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
          - name: Fedora-x86_64
            os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles rpm
          - name: Windows-x86_64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install upstream locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install desktop tooling
        run: npm install --prefix desktop --no-audit --no-fund
      - name: Build native installer
        run: npm --prefix desktop run build -- ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: Keybr-Desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/**/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/bundle/nsis/*.exe
            desktop/src-tauri/target/**/bundle/rpm/*.rpm
          retention-days: 30
